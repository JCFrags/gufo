name: Devlab binary CDN

# Must live on the default branch. This privileged relay never checks out,
# unpacks or executes PR code; only opaque ZIP bytes cross the boundary.
on:
  workflow_run:
    workflows: [ Devlab functional checks ]
    types: [ in_progress ]
  schedule:
    - cron: '23 4 * * *'

permissions: {}

concurrency:
  group: devlab-cdn-${{ github.event.workflow_run.id || 'cleanup' }}-${{ github.event.workflow_run.run_attempt || 'daily' }}
  cancel-in-progress: false

jobs:
  relay:
    if: github.repository == 'gufo-org/gufo' && github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout trusted relay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tools/ci
      - name: Copy hosted bundle to release CDN
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: python3 tools/ci/devlab_cdn.py relay --run "$SOURCE_RUN" --attempt "$SOURCE_ATTEMPT"

  cleanup:
    if: github.repository == 'gufo-org/gufo' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout trusted cleanup
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci
      - name: Remove CDN bundles older than three days
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/devlab_cdn.py cleanup
